spring.application.name=dpi-service
server.port=8080

# Largest accepted upload
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB

# Where uploaded and filtered pcaps are stored
dpi.storage-dir=${java.io.tmpdir}/dpi-service
# Worker threads inside one analysis
dpi.workers=4
# How many analyses can run at the same time
dpi.job-threads=2

# Database: a file-based H2 database in ./data (relative to where you start the app).
spring.datasource.url=jdbc:h2:file:./data/dpi;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=

# The schema comes from Flyway migrations, not from Hibernate.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false